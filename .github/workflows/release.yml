# Builds the .exe files on GitHub's servers from the public source whenever a
# version tag (v1.0.0, ...) is pushed, and attaches them to a Release.
# The build log on the Actions tab shows exactly how each file was made.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: sh build.sh

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/Linux-Check-*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Linux-Check-amd64.exe
            dist/Linux-Check-arm64.exe
            dist/SHA256SUMS.txt
            Linux-Check.ps1
            devices.json
            Linux-Check.bat
